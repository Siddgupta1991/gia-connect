name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and unit tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npx vitest run

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # Release build signed with the default debug key (fine for testing, not for Play Store).
        # Only ARM ABIs are built, which covers real Android phones and keeps the APK smaller.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "gia-connect-$VERSION.apk"
          ls -lh "gia-connect-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gia-connect-${{ steps.meta.outputs.version }}-apk
          path: gia-connect-${{ steps.meta.outputs.version }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GIA Connect ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android test build of GIA Connect ${{ steps.meta.outputs.version }}.

            Download `gia-connect-${{ steps.meta.outputs.version }}.apk` below and open it on an Android phone.
            You may need to allow "Install unknown apps" for your browser or file manager.

            This build is signed with the default debug key and is meant for testing only.
            Demo logins: see the README.
          files: gia-connect-${{ steps.meta.outputs.version }}.apk
